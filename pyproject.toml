[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pap-pilot"
version = "0.1.0"
description = "Local, evidence-linked analysis of OSCAR-normalized PAP data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx2>=2,<3",
]

[project.scripts]
pap-pilot-api = "pap_pilot.api:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pap_pilot*"]

[tool.setuptools.package-data]
"pap_pilot.ui" = ["*.css", "*.html", "*.mjs"]
