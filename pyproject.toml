[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pap-pilot"
version = "0.1.0"
description = "Local, evidence-linked analysis of OSCAR-normalized PAP data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["pap_pilot*"]
