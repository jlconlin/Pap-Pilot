<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>PAP Pilot — Experiment evidence</title>
  <link rel="stylesheet" href="/assets/overview.css">
</head>
<body>
  <div class="ambient ambient-left" aria-hidden="true"></div>
  <div class="ambient ambient-right" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="/" aria-label="PAP Pilot experiment overview">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="brand-name">PAP <strong>Pilot</strong></span>
    </a>
    <div class="local-indicator"><span aria-hidden="true"></span>Local evidence workspace</div>
  </header>
  <main id="overview" class="page-shell" aria-live="polite" aria-busy="true">
    <section class="loading-panel" aria-label="Loading experiment evidence">
      <p class="eyebrow">Experiment evidence</p>
      <h1>Loading the local report…</h1>
      <p>The overview is reading the deterministic report from PAP Pilot’s local API.</p>
      <div class="loading-line" aria-hidden="true"></div>
      <div class="loading-line loading-line-short" aria-hidden="true"></div>
    </section>
  </main>
  <noscript><p class="noscript-message">JavaScript is required to render the local experiment report. No data is sent off this computer.</p></noscript>
  <script type="module" src="/assets/overview.mjs"></script>
</body>
</html>
